[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beam-no"
version = "0.1.0"
description = "Physics-informed Fourier Neural Operator for the static Euler-Bernoulli beam (forward and inverse problems)."
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "PyYAML>=6.0",
    "torch>=2.1",
]

[tool.setuptools.packages.find]
include = ["beam_no*"]
